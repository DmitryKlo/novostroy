server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose service discovery must survive an API container replacement.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $api_origin http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /v1/ {
        proxy_pass $api_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API alone decides which render assets are public and supplies their
    # versioned immutable or revalidation cache headers, ETags, and ranges.
    location ^~ /assets/ {
        proxy_pass $api_origin;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed files under /bundled. Unknown or unhashed
    # files never receive a year-long cache lifetime.
    location ~ "^/bundled/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]{8,}[.][A-Za-z0-9]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /bundled/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Cesium copies workers and other runtime files with stable names.
    location ^~ /cesium/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
}
